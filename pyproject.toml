[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangecert"
version = "0.1.0"
description = "Exact interval-policy diff with a re-runnable witness certificate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["cidr", "firewall", "acl", "diff", "interval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
rangecert = "rangecert.cli:main"

[tool.setuptools]
packages = ["rangecert"]
